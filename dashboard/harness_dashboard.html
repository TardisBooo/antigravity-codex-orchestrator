      <div class="flex items-center gap-3 text-[11px] text-[var(--muted-foreground)] font-mono">

        <span>Tokens: <strong class="text-[var(--foreground)]">23,487</strong></span>
        <span class="hidden sm:inline"><span id="lbl-safety">防错</span>: <strong class="text-emerald-500" id="val-safety">Harness Verified</strong></span>

          <div class="text-[9px] text-[var(--muted-foreground)] mt-1">${s.subNote}</div>
        </div>
      `).join('');

      document.getElementById("detail-title").innerText = step.title;

      badge.innerText = step.badge;
      badge.className = `px-1.5 py-0.5 rounded text-[10px] font-mono ${step.badgeClass}`;

      document.getElementById("detail-model").innerText = step.model;
      document.getElementById("detail-sandbox").innerText = step.sandbox;
      document.getElementById("detail-stdin").innerText = step.stdin;
      document.getElementById("detail-cmd").innerText = step.cmd;
      document.getElementById("detail-input").innerText = step.input;
